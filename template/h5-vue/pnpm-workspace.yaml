packages:
  - apps/*
  - packages/*

# 第三方依赖版本统一在 catalog 管理，子包用 "catalog:" 引用。
# 版本锁低保 Chromium 53 / Chrome 66 兼容，禁升级。
catalog:
  vue: ^3.4.0
  vue-router: ^4.2.5
  pinia: ^2.1.7
  vite: ^5.0.0
  '@vitejs/plugin-vue': ^5.0.0
  '@vitejs/plugin-legacy': ^5.4.3
  terser: ^5.44.1
  typescript: ^5.3.0
  vue-tsc: ^2.0.8
  '@vue/tsconfig': ^0.5.0
  '@chancestv/tv-focus': ^0.4.2
  '@chancestv/tv-ui': ^0.4.2
