org.gradle.jvmargs=-Xmx2048m
# 禁止 AndroidX，全用 Support 27.1.1（遵 claude/rules/android-support-library-only.md）
android.useAndroidX=false
android.enableJetifier=false
kotlin.code.style=official

# ============ 语音配置（全局单一来源，app/internet 的 build.gradle 编译期读取）============
# 语音实现：none(不打包) | shijiu(视九) | internet(互联网语音)
# 命令行可临时覆盖：./gradlew assembleStagingDebug -Pvoice.engine=shijiu
voice.engine=none

# —— 以下仅 voice.engine=internet 时生效 ——
# ASR/TTS 云引擎选择：SYSTEM / IFLY / TENCENT / VOLC（ASR 另有 OFFLINE 占位）。网络输入模式下必须用云引擎。
voice.internet.asrMode=IFLY
voice.internet.ttsMode=IFLY
# 盒子 WebSocket Server 端口（手机客户端连接此端口）
voice.internet.networkPort=9527

# 各平台密钥（脚手架按所选平台写入；留空也可过编译）
# 讯飞（asrMode/ttsMode=IFLY 时填）
voice.internet.ifly.appId=
voice.internet.ifly.apiKey=
voice.internet.ifly.apiSecret=
# 腾讯（=TENCENT 时填）
voice.internet.tencent.secretId=
voice.internet.tencent.secretKey=
voice.internet.tencent.appId=
# 火山（=VOLC 时填）
voice.internet.volc.appId=
voice.internet.volc.token=
