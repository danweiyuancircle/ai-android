apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.3'

    defaultConfig {
        applicationId 'com.chances.shell'
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 1
        versionName '1.0.0'
        multiDexEnabled true
    }

    signingConfigs {
        // 模板 demo 签名（非生产密钥）：keystore app/shell.jks 随仓库入库，clone 即可出 release 签名包。
        // 正式项目替换为自有 keystore，并把 *.jks 移出版本控制、密钥改从 CI 凭据或 ~/.gradle 注入。
        release {
            keyAlias 'shell'
            keyPassword 'shelltemplate'
            storeFile rootProject.file('app/shell.jks')
            storePassword 'shelltemplate'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    flavorDimensions 'tier'
    productFlavors {
        // 注意：flavor 名不能以 "test" 开头（Gradle 保留），测试环境用 staging
        staging {
            dimension 'tier'
            // TODO: 测试环境 H5 入口地址（壳加载的 URL，需与 H5 base 路径一致）
            buildConfigField 'String', 'H5_URL', '"http://192.168.0.100:5173/app/"'
        }
        prod {
            dimension 'tier'
            // TODO: 生产环境 H5 入口地址
            buildConfigField 'String', 'H5_URL', '"https://your-host.example.com/app/"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // app → feature_voice:core → lib_base（透传 lib_base 与 chances-sdk core）
    implementation project(':feature_voice:core')

    // 语音实现编译期二选一：由根 gradle.properties 的 voice.engine 决定，只打包选中的实现，
    // 另一个不进 classpath，ServiceLoader 命中确定（VoiceControllerFactory）。app 不引用其具体类。
    def voiceEngine = (project.findProperty('voice.engine') ?: '').toString().trim()
    if (voiceEngine == 'shijiu') {
        runtimeOnly project(':feature_voice:shijiu')
    } else if (voiceEngine == 'internet') {
        // 互联网语音(voice-remote-sdk)：云引擎与密钥见 gradle.properties 的 voice.internet.* 段
        runtimeOnly project(':feature_voice:internet')
    } else {
        throw new GradleException("voice.engine 配置非法：'${voiceEngine}'，可选 shijiu|internet（见根 gradle.properties）")
    }

    // 仅 DEBUG 引入远程日志（无 ADB 拉 logcat / 重启 / 装 APK）
    // debugImplementation 'com.chances.sdk:wslog:1.0.0'
}
