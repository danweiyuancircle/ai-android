apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 可选：从 signing.properties 读取真实签名（该文件不入库，见 .gitignore）。
// 复制 signing.properties.example 为 signing.properties 并填写。
def signingPropsFile = rootProject.file('signing.properties')
def hasSigning = signingPropsFile.exists()
def signingProps = new Properties()
if (hasSigning) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.3'

    defaultConfig {
        // TODO: 改成项目包名
        applicationId 'com.example.shell'
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 1
        versionName '1.0.0'
        multiDexEnabled true
    }

    signingConfigs {
        if (hasSigning) {
            release {
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    flavorDimensions 'tier'
    productFlavors {
        // 注意：flavor 名不能以 "test" 开头（Gradle 保留），测试环境用 staging
        staging {
            dimension 'tier'
            // TODO: 测试环境 H5 入口地址（壳加载的 URL，需与 H5 base 路径一致）
            buildConfigField 'String', 'H5_URL', '"http://192.168.0.100:5173/app/"'
        }
        prod {
            dimension 'tier'
            // TODO: 生产环境 H5 入口地址
            buildConfigField 'String', 'H5_URL', '"https://your-host.example.com/app/"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // app → feature_voice:core → lib_base（透传 lib_base 与 chances-sdk core）
    implementation project(':feature_voice:core')
    // 视九语音实现：仅运行期/打包依赖，app 编译期不引用其类，纯靠 ServiceLoader 发现（VoiceControllerFactory）。
    // 热插拔——不用视九时删本行 + settings.gradle 的 include，模块整体不打包，自动回退 NoopVoiceController。
    runtimeOnly project(':feature_voice:shijiu')
    // 仅 DEBUG 引入远程日志（无 ADB 拉 logcat / 重启 / 装 APK）
    // debugImplementation 'com.chances.sdk:wslog:1.0.0'
}
