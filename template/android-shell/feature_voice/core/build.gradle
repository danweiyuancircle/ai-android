apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// 模块名为 core，会与依赖 com.chances.sdk:core 的 META-INF/core_release.kotlin_module 同名冲突
// （mergeJavaResource 报 duplicate）。改唯一 archivesBaseName，使 kotlin_module 文件名错开。
archivesBaseName = 'feature_voice_core'

android {
    // AGP 3.6.0：包名写在 AndroidManifest.xml 的 package 属性
    compileSdkVersion 28
    buildToolsVersion '28.0.3'

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 28
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // 依赖基础库（lib_base 透出 chances-sdk core 等基础能力）
    api project(':lib_base')

    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // 接入真实语音 SDK 时在此声明其依赖
}
